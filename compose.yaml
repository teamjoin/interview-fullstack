services:
  renderlab:
    build: ./RenderLab
    environment:
      STUDIO_CALLBACK_URL: http://api:3001/api/providers/renderlab/results
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/renderlab", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    command: pnpm dev:api
    environment:
      PORT: 3001
      RENDERLAB_URL: http://renderlab:8080
      DATABASE_PATH: /app/data/studio.sqlite
    volumes:
      - ./src:/app/src
      - studio-data-v2:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      renderlab:
        condition: service_healthy
  web:
    build: .
    command: pnpm dev:web
    environment:
      API_TARGET: http://api:3001
      APP_PORT: ${APP_PORT:-4310}
    ports:
      - "127.0.0.1:${APP_PORT:-4310}:${APP_PORT:-4310}"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    depends_on:
      api:
        condition: service_healthy
volumes:
  studio-data-v2:
